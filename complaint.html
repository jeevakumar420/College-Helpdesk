<!DOCTYPE html>
<html>
<head>
<title>Submit Complaint</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Submit Complaint</h2>

<form id="complaintForm">

<input type="text" id="name" placeholder="Your Name" required>

<input type="email" id="email" placeholder="Email" required>

<select id="issue">
<option>WiFi Issue</option>
<option>Lab System Problem</option>
<option>Portal Login Error</option>
<option>Email Problem</option>
<option>Printer Issue</option>
</select>

<textarea id="desc" placeholder="Describe your problem"></textarea>

<button type="submit">Submit</button>

</form>

<script src="script.js"></script>

</body>
</html>
